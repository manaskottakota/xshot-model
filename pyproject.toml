[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xshot"
version = "0.1.0"
description = "NBA shot quality (xShot) probabilistic models"
readme = ""
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "nba-api>=1.5.0",
  "requests>=2.31",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
accel = ["xgboost>=2.0"]
viz = ["fastapi>=0.109", "uvicorn[standard]>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
xshot-train = "xshot.training_cli:main"
xshot-predict-one = "xshot.predict_cli:main"
xshot-viz = "xshot.viz.server:main"
